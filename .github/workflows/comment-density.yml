name: Comment density

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MAX_COMMENT_RATIO: "0.05"

jobs:
  density:
    name: Comment density
    runs-on: ubuntu-latest
    steps:
      - name: Check comment density in added lines
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MAX_RATIO: ${{ env.MAX_COMMENT_RATIO }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/pulls/$PR" \
            -H "Accept: application/vnd.github.v3.diff" > pr.diff

          awk '
            /^diff --git/ {
              file = $NF
              sub(/^b\//, "", file)
              next
            }

            file !~ /\.(tsx?|jsx?|py|go)$/ { next }
            file ~ /(node_modules|vendor|dist|build|\.gen\.|generated|__generated__|\.min\.)/ { next }

            /^\+\+\+/ { next }
            /^\+/ {
              line = substr($0, 2)
              if (line ~ /^[[:space:]]*$/) next

              total++

              if (line ~ /^[[:space:]]*(\/\/|\/\*|\*\/|\* )/) { comments++; next }
              if (file ~ /\.py$/ && line ~ /^[[:space:]]*#/) { comments++; next }
              if (file ~ /\.py$/ && line ~ /^[[:space:]]*("""|'"'"''"'"''"'"')/) { comments++; next }
            }

            END {
              if (total == 0) {
                printf "No source lines added.\n"
                exit 0
              }

              ratio = comments / total
              printf "Added lines: %d total, %d comments, %d code\n", total, comments, total - comments
              printf "Comment ratio: %.2f (limit: %s)\n", ratio, ENVIRON["MAX_RATIO"]

              if (ratio + 0 > ENVIRON["MAX_RATIO"] + 0) {
                printf "FAIL\n"
                exit 1
              }
              printf "OK\n"
            }
          ' pr.diff > result.txt

          cat result.txt

          TOTAL=$(awk '/^Added lines:/ { print $3 }' result.txt)
          COMMENTS=$(awk '/^Added lines:/ { print $5 }' result.txt)
          CODE=$(awk '/^Added lines:/ { print $7 }' result.txt)
          RATIO=$(awk '/^Comment ratio:/ { print $3 }' result.txt)
          STATUS=$(tail -1 result.txt)

          {
            echo "### Comment density check"
            echo ""
            echo "| | |"
            echo "|---|---:|"
            echo "| Added source lines | **${TOTAL:-0}** |"
            echo "| Comment lines | **${COMMENTS:-0}** |"
            echo "| Code lines | **${CODE:-0}** |"
            echo "| Comment ratio | **${RATIO:-0.00}** |"
            echo "| Limit | ${MAX_RATIO} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" = "FAIL" ]; then
            {
              echo ""
              echo "**Too many comments.** Keep only comments that explain *why*, not *what*."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Comment ratio ${RATIO} exceeds limit ${MAX_RATIO}. Remove comments that restate what the code does."
            exit 1
          fi

          if [ -z "$TOTAL" ]; then
            echo "::notice::No source files changed — skipped."
          else
            echo "::notice::Comment ratio ${RATIO} within limit ${MAX_RATIO} — OK"
          fi
