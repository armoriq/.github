name: Flake report tests
on:
  pull_request:
    paths:
      - .github/actions/flake-report/**
      - .github/workflows/flake-report-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test ".github/actions/flake-report/*.test.mjs"
