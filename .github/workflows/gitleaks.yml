name: Gitleaks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    uses: armoriq/.github/.github/workflows/reusable-gitleaks.yml@main
