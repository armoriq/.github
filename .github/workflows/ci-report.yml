name: CI report

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-report:
    name: CI report
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Scorecard
        continue-on-error: true
        uses: armoriq/.github/.github/actions/scorecard@fb786658484eddbdd59f9ad323dbd436d850b05a
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          base_ref: ${{ github.event.pull_request.base.ref }}
          default_branch: ${{ github.event.repository.default_branch }}
      - uses: armoriq/.github/.github/actions/ci-report@fb786658484eddbdd59f9ad323dbd436d850b05a
        with:
          wait_variable: ${{ vars.CI_REPORT_WAIT_MINUTES }}
          wait_secret: ${{ secrets.CI_REPORT_WAIT_MINUTES }}
          scorecard: ${{ runner.temp }}/scorecard.json
