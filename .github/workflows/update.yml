name: Update Download Stats

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6 AM UTC
  workflow_dispatch:       # Manual trigger

# The job token is used for checkout only. Everything else runs on an App
# installation token: the job token is scoped to this repo alone (so it cannot
# read the private tracked repos, nor any repo's /traffic/clones), and the org
# forbids Actions-created pull requests.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check the App credentials are present
        env:
          TRACKER_APP_ID: ${{ vars.TRACKER_APP_ID }}
          TRACKER_APP_PRIVATE_KEY: ${{ secrets.TRACKER_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${TRACKER_APP_ID:-}" ]; then
            echo "::error::TRACKER_APP_ID variable is not set."
            exit 1
          fi
          if [ -z "${TRACKER_APP_PRIVATE_KEY:-}" ]; then
            echo "::error::TRACKER_APP_PRIVATE_KEY secret is not set."
            exit 1
          fi

      # Scoped to every repo the App is installed on in this org, so one token
      # covers both the tracked repos (read) and this repo (write).
      - name: Mint an App installation token
        id: app-token
        uses: actions/create-github-app-token@21cfef2b496dd8ef5b904c159339626a10ad380e # v1.11.6
        with:
          app-id: ${{ vars.TRACKER_APP_ID }}
          private-key: ${{ secrets.TRACKER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute update date
        id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # No GITHUB_TOKEN fallback on purpose: the job token cannot see the
      # private tracked repos, so falling back to it would silently record
      # partial data instead of failing.
      - name: Fetch download data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/fetch_downloads.py

      - name: Generate plots and update README
        run: python scripts/generate_plots.py

      # Commits are created via the GitHub API (sign-commits: true) so they
      # carry a verified signature. The App token is required here because the
      # org disallows Actions-created PRs ("GitHub Actions is not permitted to
      # create or approve pull requests") — an App is not GitHub Actions.
      - name: Open signed PR with updates
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          commit-message: "Update download stats for ${{ steps.date.outputs.value }}"
          title: "Update download stats for ${{ steps.date.outputs.value }}"
          body: |
            Automated daily refresh of traction data, plots, and README.
          branch: auto/update-stats-${{ steps.date.outputs.value }}
          delete-branch: true
          add-paths: |
            data
            plots
            README.md

      # `main` in this repo carries no rules (the org ruleset
      # `main-protect-only-PRs` excludes repositories named `.github`), so the
      # PR is CLEAN immediately and the first merge normally succeeds.
      # `gh pr merge --auto` errors with "Pull request is in clean status" when
      # there is nothing to wait on, so --auto is only the fallback.
      - name: Merge PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge --squash --delete-branch "$PR" -R "$REPO" \
            || gh pr merge --auto --squash --delete-branch "$PR" -R "$REPO"
