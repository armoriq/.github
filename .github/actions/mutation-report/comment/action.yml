name: Mutation comment
description: Posts or updates one PR comment with the Stryker result.
inputs:
  report:
    description: Path to Stryker's JSON report.
    default: reports/mutation/mutation.json
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT: ${{ inputs.report }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        body="$(node "$GITHUB_ACTION_PATH/../comment.mjs" "$REPORT" "$RUN_URL")"
        printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
        existing="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | startswith("<!-- mutation-report -->")) | .id' | head -n 1)"
        if [ -n "$existing" ]; then
          gh api "repos/$REPO/issues/comments/$existing" --method PATCH -f body="$body" > /dev/null
        else
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --method POST -f body="$body" > /dev/null
        fi
