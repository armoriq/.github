name: Action tests

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/action-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Action tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test ".github/actions/**/*.test.mjs"
