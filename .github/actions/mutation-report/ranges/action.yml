name: Mutation ranges
description: Lists the lines a PR adds inside a scope as Stryker mutate patterns.
inputs:
  base:
    description: Revision to diff against.
    required: true
  scope:
    description: Git pathspecs, one per line. Prefix an exclusion with ':!'.
    required: true
  shards:
    description: Maximum number of shards to split the ranges into.
    default: '1'
outputs:
  mutate:
    description: Comma-separated file:start-end patterns, empty when the PR adds no lines in scope.
    value: ${{ steps.ranges.outputs.mutate }}
  matrix:
    description: JSON array of shards, each with index, lines and mutate; empty array when nothing is in scope.
    value: ${{ steps.ranges.outputs.matrix }}
  count:
    description: Number of shards in matrix.
    value: ${{ steps.ranges.outputs.count }}
runs:
  using: composite
  steps:
    - id: ranges
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        SCOPE: ${{ inputs.scope }}
        SHARDS: ${{ inputs.shards }}
      run: |
        set -euo pipefail
        mapfile -t specs < <(printf '%s\n' "$SCOPE" | sed '/^[[:space:]]*$/d')
        mutate="$(node "$GITHUB_ACTION_PATH/../ranges.mjs" --base "$BASE" -- "${specs[@]}")"
        matrix="$(MUTATE="$mutate" node "$GITHUB_ACTION_PATH/../shard.mjs" "$SHARDS")"
        count="$(jq length <<< "$matrix")"
        echo "mutate=$mutate" >> "$GITHUB_OUTPUT"
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        echo "count=$count" >> "$GITHUB_OUTPUT"
        echo "Ranges to mutate: ${mutate:-none}"
        echo "Shards: $matrix"
