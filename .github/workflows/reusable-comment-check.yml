name: Reusable comment check
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: armoriq/.github/.github/actions/code-checks/comment-check@main
        with:
          base: HEAD^1
