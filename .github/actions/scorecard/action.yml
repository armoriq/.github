name: Scorecard
description: Measures a pull request's comment density, changed-function complexity and mergeability facts.
inputs:
  base:
    description: Base commit SHA of the pull request.
    required: true
  head:
    description: Head commit SHA of the pull request. The caller checks it out with full history.
    required: true
  base_ref:
    description: Base branch name of the pull request.
    required: true
  default_branch:
    description: Default branch of the repository.
    required: true
outputs:
  path:
    description: Path of the scorecard JSON.
    value: ${{ steps.collect.outputs.path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install measuring tools
      shell: bash
      run: |
        npm ci --prefix "$GITHUB_ACTION_PATH" --ignore-scripts --no-audit --no-fund
        python -m pip install --quiet --requirement "$GITHUB_ACTION_PATH/requirements.txt"
    - id: collect
      name: Measure the change
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base }}
        HEAD_SHA: ${{ inputs.head }}
        BASE_REF: ${{ inputs.base_ref }}
        DEFAULT_BRANCH: ${{ inputs.default_branch }}
      run: node "$GITHUB_ACTION_PATH/collect.mjs"
