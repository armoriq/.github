name: Update Download Stats

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6 AM UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute update date
        id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch download data
        env:
          GH_TOKEN: ${{ secrets.TRACTION_GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/fetch_downloads.py

      - name: Generate plots and update README
        run: python scripts/generate_plots.py

      # Commits are created via the GitHub API (sign-commits: true) so they
      # carry a verified github-actions[bot] signature, and changes land via a
      # PR — both required by the org ruleset on `main`.
      - name: Open signed PR with updates
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: "Update download stats for ${{ steps.date.outputs.value }}"
          title: "Update download stats for ${{ steps.date.outputs.value }}"
          body: |
            Automated daily refresh of traction data, plots, and README.
          branch: auto/update-stats-${{ steps.date.outputs.value }}
          delete-branch: true
          add-paths: |
            data
            plots
            README.md

      # Try an immediate squash merge first — with the org ruleset's approval
      # requirement dropped, the PR is usually already in CLEAN state by the
      # time we get here. `gh pr merge --auto` fails ("Pull request is in clean
      # status") when there's nothing for auto-merge to wait on, so we only
      # fall back to --auto when the immediate merge is rejected because the
      # PR is genuinely pending (e.g. a status check still running).
      - name: Merge PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge --squash --delete-branch "$PR" -R "$REPO" \
            || gh pr merge --auto --squash --delete-branch "$PR" -R "$REPO"
